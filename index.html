<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Mi App Responsiva</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <h1>📱 Mi App Responsiva</h1>
        <p>Bienvenido a mi aplicación web</p>
    </header>

    <main class="contenedor">

        <section class="bienvenida">
            <h2>¡Hola, bienvenido!</h2>
            <p>
                Esta aplicación se adapta
                automáticamente al tamaño
                de tu pantalla.
            </p>

            <button onclick="saludar()">
                Explorar aplicación
            </button>
        </section>

        <section class="tarjetas">

            <div class="tarjeta">
                <div class="icono">📱</div>
                <h2>Diseño móvil</h2>
                <p>Adaptable a celulares.</p>
            </div>

            <div class="tarjeta">
                <div class="icono">🎨</div>
                <h2>Estilos CSS</h2>
                <p>Colores personalizados.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Mi App Responsiva</p>
    </footer>

    <script>
        function saludar() {
            alert("¡Bienvenido a mi aplicación!");
        }
    </script>

</body>
</html>
